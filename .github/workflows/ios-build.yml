name: Build iOS App

on:
  push:
    branches: [ main ]
    # 只改文档不该烧掉一次 10 分钟的 macOS 构建
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # 0) 编译前自检：工程文件漏了任何一处，都在这里说清楚，不用等五分钟才看到 xcodebuild 报错
      #    三个脚本都不依赖 Swift 工具链，纯 Python：
      #    selfcheck.py           工程引用 / 分类 ID 一致性
      #    static_compile_check.py 符号解析 / import 覆盖 / API 可用性
      #    amount_lab.py          金额链路：把 BillParser 的正则抽出来镜像执行
      - name: 工程自检
        run: |
          set -o pipefail
          if [ ! -f scripts/selfcheck.py ]; then
            echo "⚠️ 没找到 scripts/selfcheck.py（可能上传时漏了这个文件夹），跳过自检直接编译" | tee selfcheck.log
            echo "⚠️ 没找到 scripts/selfcheck.py，已跳过自检" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            python3 scripts/selfcheck.py
            if [ -f scripts/static_compile_check.py ]; then python3 scripts/static_compile_check.py; fi
            if [ -f scripts/amount_lab.py ]; then python3 scripts/amount_lab.py; fi
          } 2>&1 | tee selfcheck.log
          echo "### 工程自检" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 selfcheck.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 核心逻辑回归测试：退款/报销统计、OCR/自然语言金额边界、旧备份兼容
      # 注意：测试失败不阻断打包。目标是拿到 ipa，测试结果只作为质量信号。
      - name: 核心逻辑 XCTest
        continue-on-error: true
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | awk -F'(' '/iPhone/ {gsub(/^ +| +$/,"",$1); print $1; exit}')
          if [ -z "$DEVICE" ]; then
            echo "## ⚠️ 没找到可用 iPhone 模拟器，跳过测试（不影响 ipa）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "使用模拟器：$DEVICE"
          xcodebuild test \
            -project MonoLedger.xcodeproj \
            -scheme MonoLedger \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee test-core.log | grep -E "error:|Test Case|TEST (SUCCEEDED|FAILED)" || true
          if grep -q "TEST SUCCEEDED" test-core.log; then
            echo "## ✅ 核心逻辑测试通过" >> "$GITHUB_STEP_SUMMARY"
          elif grep -qE "xcodebuild: error|Unable to read project|BUILD FAILED" test-core.log; then
            # 这不是「测试失败」，是源码压根没编译过——xcodebuild 一条测试都没跑。
            # 以前这种情况会被记成「测试未通过（可容忍）」，看起来像跑过，实际是空转。
            echo "::error::源码未通过编译，一条测试都没有执行"
            echo "## ❌ 测试根本没跑起来（编译失败，不是测试失败）" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|BUILD FAILED" test-core.log | head -10 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⚠️ 核心逻辑测试未通过（ipa 仍会打包，请留意）" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|failed|Failure" test-core.log | head -30 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # 1) 免签名编译真机版本（供 SideStore / TrollStore 安装）
      - name: 编译真机版（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project MonoLedger.xcodeproj \
            -scheme MonoLedger \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|warning: .*(deprecated|unused)" || true
          if ! grep -q "BUILD SUCCEEDED" build-device.log; then
            echo "## ❌ 真机编译失败" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:" build-device.log | head -20 >> "$GITHUB_STEP_SUMMARY" || echo "日志里没有 error: 行" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## ✅ 真机编译通过" >> "$GITHUB_STEP_SUMMARY"

      - name: 打包成 .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "❌ 没找到 .app 产物"; exit 1; fi
          echo "产物：$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MonoLedger-unsigned.ipa Payload
          ls -lh MonoLedger-unsigned.ipa

      # 2) 模拟器编译，确认 UI 代码本身没问题
      - name: 编译模拟器版
        run: |
          set -o pipefail
          xcodebuild \
            -project MonoLedger.xcodeproj \
            -scheme MonoLedger \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" build-sim.log; then
            echo "## ⚠️ 模拟器编译失败（ipa 已经出来了，可以先用）" >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:" build-sim.log | head -10 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ 模拟器编译通过" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: MonoLedger-ipa
          path: MonoLedger-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # 3) 解析器回归：判定器（金标准+蜕变+不变量+几何）→ 模糊 3000 条 → 变异 18 个。
      #    放在打包之后跑，ipa 已经拿到手了再慢慢跑，不会因为这一步失败而拿不到产物。
      #    macOS runner 自带 swiftc，不需要额外装工具链。
      - name: 解析器回归（判定器 / 模糊 / 变异）
        continue-on-error: true
        timeout-minutes: 20
        run: |
          # 没有 pipefail 时，`run.sh | tee` 的退出码是 tee 的，恒为 0——
          # 回归脚本编译失败也会被记成绿色通过（实际发生过）。
          set -o pipefail
          if [ ! -d scripts/parser_lab ]; then
            echo "## ⚠️ 没有 scripts/parser_lab，跳过解析器回归" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if bash scripts/parser_lab/run.sh 2>&1 | tee parser-lab.log; then
            echo "## ✅ 解析器回归通过" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::解析器回归没跑完（编译失败或有用例不通过），详情见日志"
            echo "## ❌ 解析器回归失败（不代表 ipa 不可用，但三套用例的结论不能当真）" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 parser-lab.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-device.log
            build-sim.log
            selfcheck.log
            test-core.log
            parser-lab.log
          retention-days: 7
